[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Retrieval-augmented extraction of KPIs from portfolio company reports"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
